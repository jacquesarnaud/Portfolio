[project]
name = "python-ia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
entrypoint = "app:app"
authors = [
    { name = "jacquesarnaud", email = "jaarnaud4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "aiosqlite>=0.20.0",
    "anyio>=4.6.0,<4.10.0",
    "asyncpg>=0.30.0",
    "click>=8.1.7,<8.2.0",
    "fastapi[standard]>=0.115.0,<0.116.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "pydantic>=2.8.0,<2.10.0",
    "pydantic-settings>=2.6.0,<2.8.0",
    "PyJWT>=2.9.0,<3.0.0",
    "python-multipart>=0.0.12,<0.0.20",
    "sqlmodel>=0.0.22,<0.0.23",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "websockets>=12.0,<14.0",
]

[project.scripts]
python-ia = "python_ia:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
