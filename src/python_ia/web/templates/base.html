<!doctype html>
<html lang="fr" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Portfolio professionnel{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/site.css') }}"
    />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg border-bottom border-secondary sticky-top"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="/"
          >Portfolio<span class="text-blue">.</span></a
        >
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="nav" class="collapse navbar-collapse">
          <div class="navbar-nav ms-auto gap-3 align-items-lg-center">
            <a class="nav-link" href="/#services">Services</a
            ><a class="nav-link" href="/projets">Projets</a
            ><a class="nav-link" href="/#method">Méthode</a
            ><a class="nav-link" href="/a-propos">À propos</a
            ><a class="nav-link" href="/experiences">Expériences</a
            ><a class="nav-link" href="/formations">Formation</a
            ><a class="nav-link" href="/contact">Contact</a>
          </div>
        </div>
      </div>
    </nav>
    {% block content %}{% endblock %}
    <footer class="border-top border-secondary py-4 mt-5">
      <div class="container text-secondary small">
        <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
          <span>© Portfolio professionnel</span>
          <a class="small text-secondary" href="/admin/login">Espace administration</a>
        </div>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
