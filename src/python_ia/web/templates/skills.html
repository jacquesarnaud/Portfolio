{% extends "base.html" %}{% block title %}Compétences — Portfolio{% endblock %}
{% block content %}<main class="container section-space"><p class="text-blue">EXPERTISE</p><h1>Compétences</h1><div class="row g-4 mt-4">{% for skill in skills %}<div class="col-sm-6 col-lg-4"><article class="card p-4 h-100"><h2 class="h5">{{ skill.name }}</h2><p class="text-secondary mb-0">{{ skill.category or 'Technologie' }}</p></article></div>{% else %}<p class="text-secondary">Les compétences seront bientôt disponibles.</p>{% endfor %}</div></main>{% endblock %}
