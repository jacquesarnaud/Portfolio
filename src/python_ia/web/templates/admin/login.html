{% extends "base.html" %}
{% block title %}Connexion — Administration{% endblock %}
{% block content %}<main class="container py-5" style="max-width:520px"><div class="card p-4 p-md-5"><p class="text-blue">ESPACE PRIVÉ</p><h1 class="h2 mb-4">Connexion administrateur</h1><div id="login-error" class="alert alert-danger d-none"></div><form id="login-form"><label class="form-label">Identifiant<input class="form-control mb-3" name="username" required></label><label class="form-label">Mot de passe<input class="form-control mb-4" type="password" name="password" required></label><button class="btn btn-info w-100">Se connecter</button></form></div></main>{% endblock %}
{% block scripts %}<script>document.querySelector('#login-form').onsubmit=async(e)=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(r.ok){localStorage.setItem('portfolio_admin_token',(await r.json()).access_token);location.href='/admin'}else{document.querySelector('#login-error').textContent='Identifiants invalides';document.querySelector('#login-error').classList.remove('d-none')}};</script>{% endblock %}
